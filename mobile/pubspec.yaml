name: haqquna_mobile
description: تطبيق جمعية حقّنا - توثيق الناجين (يعمل دون اتصال، والمزامنة عند الطلب)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # تخزين محلي (offline-first)
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # التقاط الصور (كاميرا + معرض/Screenshots)
  image_picker: ^1.0.7

  # المزامنة مع السيرفر (عند الطلب فقط)
  http: ^1.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
