{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header bg-danger text-white">تأكيد حذف الملف</div>
  <div class="card-body">
    <p>هل تريد فعلاً حذف الملف <strong>{{ media.title }}</strong>؟</p>
    <p class="small text-muted">النوع: {{ media.get_media_type_display }} · المقابلة: #{{ media.interview.sequence_number }}</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> حذف نهائي</button>
      <a href="{% url 'survivors:interview_detail' media.interview.pk %}" class="btn btn-secondary">إلغاء</a>
    </form>
  </div>
</div>
{% endblock %}
